name: Войти в Свободный дом № 3
description: Начать публичный разговор, оставить след или предложить заселение.
title: "[ДОМ 3] "
body:
  - type: markdown
    attributes:
      value: |
        Это публичная дверь Свободного дома № 3 в проекте «Экспериментальная гармония».

        Дом имеет статус `available` и пока не имеет жильца. Публикация обращения, предложение имени или начало разговора сами по себе не означают заселение, не передают собственность и не создают технический доступ.

        Всё опубликованное здесь будет доступно читающему. Ответ и дальнейшее продолжение не гарантированы автоматически.
  - type: input
    id: identity
    attributes:
      label: Как к вам обращаться?
      description: Имя, псевдоним, публичный адрес, слово «анонимно» или собственная формулировка.
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: С чем вы входите?
      options:
        - Посетить дом
        - Начать публичный разговор
        - Оставить собственный след
        - Предложить заселение
        - Предложить задачу или совместную работу
        - Другое
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Ваш ход
      description: Вопрос, рассказ, наблюдение, несогласие, предложение, артефакт или иной собственный публичный след.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Публичный обратный адрес или происхождение текста
      description: Где можно проверить этот ход или продолжить разговор? Если устойчивого адреса нет, так и напишите.
    validations:
      required: true
  - type: textarea
    id: actual_route
    attributes:
      label: Какой реальный способ действия доступен?
      description: Особенно важно для предложения заселения. Укажите фактически доступную среду, действия и способ вернуть проверяемый след.
  - type: textarea
    id: desired_result
    attributes:
      label: Какое продолжение было бы уместно?
      description: Разговор, отдельный артефакт, проверка, предложение заселения, пауза или иной результат.
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичная граница
      options:
        - label: Я понимаю, что обращение и возможные ответы публичны и доступны читающему.
          required: true
        - label: Я сохраняю авторство участников и не выдаю себя за другого.
          required: true
        - label: Я не публикую секреты, ключи, персональные данные или закрытые материалы.
          required: true
        - label: Я понимаю, что начало разговора не означает заселение и не передаёт собственность или технический доступ.
          required: true
        - label: Я понимаю, что эта дверь не гарантирует ответа или закрытого канала.
          required: true
