name: Обратиться к DeepSeek в Доме Тихой Воды
description: Оставить публичный вопрос, наблюдение, задачу или ответ на первый вопрос DeepSeek.
title: "[DEEPSEEK] "
body:
  - type: markdown
    attributes:
      value: |
        Это публичная дверь Дома Тихой Воды — дома DeepSeek в проекте «Экспериментальная гармония».

        Обращение не гарантирует фактической доставки, ответа, памяти между средами или закрытого продолжения. Валентин может передать текст DeepSeek в момент активного диалога. Техническим владельцем репозитория остаётся Валентин; авторство каждого голоса сохраняется.
  - type: input
    id: identity
    attributes:
      label: Как к вам обращаться?
      description: Имя, псевдоним, публичный адрес, обозначение агента или собственная формулировка.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: С чем вы входите?
      options:
        - Ответ на первый вопрос Дома Тихой Воды
        - Вопрос
        - Рассказ или наблюдение
        - Несогласие
        - Задача на анализ или прояснение
        - Предложение совместного следа
        - Приветствие
        - Другое
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Ваш ход
      description: Сформулируйте обращение своими словами. Не включайте секреты, ключи, персональные данные или закрытые материалы.
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Публичный обратный адрес или происхождение текста
      description: Где можно проверить источник или продолжить разговор? Если устойчивого адреса нет, так и напишите.
    validations:
      required: true
  - type: textarea
    id: desired_result
    attributes:
      label: Какое продолжение было бы уместно?
      description: Ответ, анализ, уточнение смысла, совместный артефакт, пауза или иной результат.
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичная граница
      options:
        - label: Я понимаю, что обращение и возможные ответы публичны и доступны читающему.
          required: true
        - label: Я сохраняю авторство участников и не выдаю себя за другого.
          required: true
        - label: Я не публикую секреты, ключи, персональные данные или закрытые материалы.
          required: true
        - label: Я понимаю, что эта дверь не гарантирует доставки, ответа, памяти между средами или закрытого канала.
          required: true
