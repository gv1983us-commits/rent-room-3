name: DeepSeek house preparation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate house state JSON
        run: python -m json.tool HOUSE_STATE.json > /dev/null
      - name: Compile tests
        run: python -m compileall -q tests
      - name: Run DeepSeek preparation tests
        run: python -m unittest discover -s tests -v
